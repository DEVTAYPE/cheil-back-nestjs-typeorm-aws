# Redirección de HTTP → HTTPS
server {
    listen 80;
    server_name cheil.juantaype.dev;
    return 301 https://$host$request_uri;
}

# Bloque HTTPS con certificado SSL
server {
    listen 443 ssl;
    server_name cheil.juantaype.dev;

    # Certificados emitidos por Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/cheil.juantaype.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cheil.juantaype.dev/privkey.pem;

    # Configuración recomendada de SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Backend API
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check para AWS ALB/ELB
    location /api/v1/health {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }
}
